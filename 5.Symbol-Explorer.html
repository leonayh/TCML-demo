<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>探索你的台灣符號</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* this page only: black backdrop around the 400px column */
  html, body, #stage { background: #000 !important; }
</style>
</head>
<body>
<div id="stage"><div id="scaler-box"><div id="scaler"><div id="root"></div></div></div></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="atoms.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>

<script type="text/babel">
/* standalone mount of the Taiwan-symbol discovery flow */
function SymbolPage(){
  return (
    <div className="screen">
      <HeroFlow home={()=>{location.href='1.Home.html';}}/>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<SymbolPage/>);

/* width-governed sizing (same as demo) */
function fit(){
  const s=document.getElementById('scaler');
  const box=document.getElementById('scaler-box');
  if(!s||!box) return;
  const k=Math.min(1, window.innerWidth/400);
  s.style.transform='scale('+k+')';
  box.style.width=(400*k)+'px';
  box.style.height=(812*k)+'px';
}
window.addEventListener('resize',fit);
setTimeout(fit,60); setTimeout(fit,400);
</script>
</body>
</html>
